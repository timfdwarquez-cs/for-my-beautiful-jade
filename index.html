<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>For my beautiful Jade</title>
  <meta name="description" content="Pretty, soft, cute. A little photo gallery.">
  <meta name="theme-color" content="#fff0f4">

  <!-- Website logo as the site icon -->
  <link rel="icon" href="thumbelina-gallery/thumbelina-gallery/assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="thumbelina-gallery/thumbelina-gallery/assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="thumbelina-gallery/thumbelina-gallery/assets/favicon-192.png">
  <link rel="apple-touch-icon" href="thumbelina-gallery/thumbelina-gallery/assets/apple-touch-icon.png">

  <meta property="og:title" content="Thumbelina">
  <meta property="og:description" content="Pretty, soft, cute.">
  <meta property="og:image" content="thumbelina-gallery/thumbelina-gallery/assets/bouquet.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#" aria-label="Thumbelina home">
      <img src="thumbelina-gallery/thumbelina-gallery/assets/logo.webp" alt="" width="44" height="44">
      <span>For my Jade</span>
    </a>
  </header>

  <main>
    <section class="hero">
      <img class="hero__img" src="thumbelina-gallery/thumbelina-gallery/assets/bouquet.webp" alt="A pink bouquet of photo cards tied with a Thumbelina ribbon" width="900" height="900">
      <h1></h1>
      <p>Touch a photo to see more.</p>
    </section>

    <section class="gallery" aria-label="Photo gallery">
      <figure class="card" data-message="I love you to the moon and back"><div class="card__lift"><img src="thumbelina-gallery/thumbelina-gallery/assets/sticker1.webp" alt="Photo 1" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span><span class="card__message" role="status" aria-live="polite" aria-atomic="true"></span></figure>
      <figure class="card" data-message="You make my heart feel at home"><div class="card__lift"><img src="thumbelina-gallery/thumbelina-gallery/assets/sticker2.webp" alt="Photo 2" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span><span class="card__message" role="status" aria-live="polite" aria-atomic="true"></span></figure>
      <figure class="card" data-message="You're my favorite person, always"><div class="card__lift"><img src="thumbelina-gallery/thumbelina-gallery/assets/sticker3.webp" alt="Photo 3" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span><span class="card__message" role="status" aria-live="polite" aria-atomic="true"></span></figure>
      <figure class="card" data-message="You make every day sweeter"><div class="card__lift"><img src="thumbelina-gallery/thumbelina-gallery/assets/sticker4.webp" alt="Photo 4" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span><span class="card__message" role="status" aria-live="polite" aria-atomic="true"></span></figure>
      <figure class="card" data-message="I'd choose you every time"><div class="card__lift"><img src="thumbelina-gallery/thumbelina-gallery/assets/sticker5.webp" alt="Photo 5" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span><span class="card__message" role="status" aria-live="polite" aria-atomic="true"></span></figure>
      <figure class="card" data-message="You are my happy place"><div class="card__lift"><img src="thumbelina-gallery/thumbelina-gallery/assets/sticker6.webp" alt="Photo 6" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span><span class="card__message" role="status" aria-live="polite" aria-atomic="true"></span></figure>
    </section>
  </main>

  <footer>Made by Florian</footer>
  <script src="script.js"></script>
</body>
</html>
