<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Thumbelina</title>
  <meta name="description" content="Pretty, soft, cute. A little photo gallery.">
  <meta name="theme-color" content="#fff0f4">

  <!-- Website logo as the site icon -->
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon-192.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <meta property="og:title" content="Thumbelina">
  <meta property="og:description" content="Pretty, soft, cute.">
  <meta property="og:image" content="assets/bouquet.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#" aria-label="Thumbelina home">
      <img src="assets/logo.webp" alt="" width="44" height="44">
      <span>Thumbelina</span>
    </a>
  </header>

  <main>
    <section class="hero">
      <img class="hero__img" src="assets/bouquet.webp" alt="A pink bouquet of photo cards tied with a Thumbelina ribbon" width="900" height="900">
      <h1>Pretty. Soft. Cute.</h1>
      <p>Touch a photo to make it float.</p>
    </section>

    <section class="gallery" aria-label="Photo gallery">
      <figure class="card"><div class="card__lift"><img src="assets/sticker1.webp" alt="Photo 1" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span></figure>
      <figure class="card"><div class="card__lift"><img src="assets/sticker2.webp" alt="Photo 2" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span></figure>
      <figure class="card"><div class="card__lift"><img src="assets/sticker3.webp" alt="Photo 3" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span></figure>
      <figure class="card"><div class="card__lift"><img src="assets/sticker4.webp" alt="Photo 4" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span></figure>
      <figure class="card"><div class="card__lift"><img src="assets/sticker5.webp" alt="Photo 5" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span></figure>
      <figure class="card"><div class="card__lift"><img src="assets/sticker6.webp" alt="Photo 6" width="661" height="649" loading="lazy" draggable="false"></div><span class="card__shadow"></span></figure>
    </section>
  </main>

  <footer>made with love</footer>
  <script src="script.js"></script>
</body>
</html>
